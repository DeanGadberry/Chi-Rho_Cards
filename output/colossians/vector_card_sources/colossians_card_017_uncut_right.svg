    <g transform="translate(11.25,11.25)" clip-path="url(#trim-17)">
    <text x="17" y="25" class="header-title">Colossians 3:12-15</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">12</text><text x="31" y="45.00" class="scripture-text">Put on therefore, as the elect of God,</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">holy and beloved, bowels of mercies,</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">kindness, humbleness of mind,</text><text x="17" y="84.00" class="scripture-num"></text><text x="31" y="84.00" class="scripture-text">meekness, longsuffering;</text><text x="17" y="99.00" class="scripture-num">13</text><text x="31" y="99.00" class="scripture-text">Forbearing one another, and</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">forgiving one another, if any man</text><text x="17" y="125.00" class="scripture-num"></text><text x="31" y="125.00" class="scripture-text">have a quarrel against any: even as</text><text x="17" y="138.00" class="scripture-num"></text><text x="31" y="138.00" class="scripture-text">Christ forgave you, so also do ye.</text><text x="17" y="153.00" class="scripture-num">14</text><text x="31" y="153.00" class="scripture-text">And above all these things put on</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">charity, which is the bond of</text><text x="17" y="179.00" class="scripture-num"></text><text x="31" y="179.00" class="scripture-text">perfectness.</text><text x="17" y="194.00" class="scripture-num">15</text><text x="31" y="194.00" class="scripture-text">And let the peace of God rule in</text><text x="17" y="207.00" class="scripture-num"></text><text x="31" y="207.00" class="scripture-text">your hearts, to the which also ye are</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">called in one body; and be ye</text><text x="17" y="233.00" class="scripture-num"></text><text x="31" y="233.00" class="scripture-text">thankful.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">9/12</text>
