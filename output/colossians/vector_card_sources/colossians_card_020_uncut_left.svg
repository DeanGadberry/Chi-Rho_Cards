    <rect x="0" y="0" width="26.875" height="337.5" fill="url(#edge-left-20)" />
    <g transform="translate(26.875,11.25)" clip-path="url(#trim-20)">
    <text x="17" y="25" class="header-title">Colossians 4:1-6</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">1</text><text x="31" y="45.00" class="scripture-text">Masters, give unto your servants that</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">which is just and equal; knowing</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">that ye also have a Master in heaven.</text><text x="17" y="86.00" class="scripture-num">2</text><text x="31" y="86.00" class="scripture-text">Continue in prayer, and watch in</text><text x="17" y="99.00" class="scripture-num"></text><text x="31" y="99.00" class="scripture-text">the same with thanksgiving;</text><text x="17" y="114.00" class="scripture-num">3</text><text x="31" y="114.00" class="scripture-text">Withal praying also for us, that God</text><text x="17" y="127.00" class="scripture-num"></text><text x="31" y="127.00" class="scripture-text">would open unto us a door of</text><text x="17" y="140.00" class="scripture-num"></text><text x="31" y="140.00" class="scripture-text">utterance, to speak the mystery of</text><text x="17" y="153.00" class="scripture-num"></text><text x="31" y="153.00" class="scripture-text">Christ, for which I am also in bonds:</text><text x="17" y="168.00" class="scripture-num">4</text><text x="31" y="168.00" class="scripture-text">That I may make it manifest, as I</text><text x="17" y="181.00" class="scripture-num"></text><text x="31" y="181.00" class="scripture-text">ought to speak.</text><text x="17" y="196.00" class="scripture-num">5</text><text x="31" y="196.00" class="scripture-text">Walk in wisdom toward them that</text><text x="17" y="209.00" class="scripture-num"></text><text x="31" y="209.00" class="scripture-text">are without, redeeming the time.</text><text x="17" y="224.00" class="scripture-num">6</text><text x="31" y="224.00" class="scripture-text">Let your speech be alway with grace,</text><text x="17" y="237.00" class="scripture-num"></text><text x="31" y="237.00" class="scripture-text">seasoned with salt, that ye may know</text><text x="17" y="250.00" class="scripture-num"></text><text x="31" y="250.00" class="scripture-text">how ye ought to answer every man.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">10/12</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">CHI-RHO</text>
  </g>
</svg>