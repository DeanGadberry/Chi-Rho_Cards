    <style>
    @font-face { font-family: "EB Garamond"; src: url("../../../assets/fonts/EBGaramond-Regular.ttf"); }
    .header-title { font: 700 12px "EB Garamond", serif; letter-spacing: 1.5px; fill: #556B2F; }
