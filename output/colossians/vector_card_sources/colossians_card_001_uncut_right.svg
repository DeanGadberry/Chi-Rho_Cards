    <g transform="translate(11.25,11.25)" clip-path="url(#trim-1)">
    <text x="17" y="25" class="header-title">Colossians 1:1-4</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">1</text><text x="31" y="45.00" class="scripture-text">Paul, an apostle of Jesus Christ by</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">the will of God, and Timotheus our</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">brother,</text><text x="17" y="86.00" class="scripture-num">2</text><text x="31" y="86.00" class="scripture-text">To the saints and faithful brethren</text><text x="17" y="99.00" class="scripture-num"></text><text x="31" y="99.00" class="scripture-text">in Christ which are at Colosse:</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">Grace be unto you, and peace, from</text><text x="17" y="125.00" class="scripture-num"></text><text x="31" y="125.00" class="scripture-text">God our Father and the Lord Jesus</text><text x="17" y="138.00" class="scripture-num"></text><text x="31" y="138.00" class="scripture-text">Christ.</text><text x="17" y="153.00" class="scripture-num">3</text><text x="31" y="153.00" class="scripture-text">We give thanks to God and the</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">Father of our Lord Jesus Christ,</text><text x="17" y="179.00" class="scripture-num"></text><text x="31" y="179.00" class="scripture-text">praying always for you,</text><text x="17" y="194.00" class="scripture-num">4</text><text x="31" y="194.00" class="scripture-text">Since we heard of your faith in</text><text x="17" y="207.00" class="scripture-num"></text><text x="31" y="207.00" class="scripture-text">Christ Jesus, and of the love which</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">ye have to all the saints,</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">1/12</text>
