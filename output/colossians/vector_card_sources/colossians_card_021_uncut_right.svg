    <g transform="translate(11.25,11.25)" clip-path="url(#trim-21)">
    <text x="17" y="25" class="header-title">Colossians 4:7-10</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">7</text><text x="31" y="45.00" class="scripture-text">All my state shall Tychicus declare</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">unto you, who is a beloved brother,</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">and a faithful minister and</text><text x="17" y="84.00" class="scripture-num"></text><text x="31" y="84.00" class="scripture-text">fellowservant in the Lord:</text><text x="17" y="99.00" class="scripture-num">8</text><text x="31" y="99.00" class="scripture-text">Whom I have sent unto you for the</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">same purpose, that he might know</text><text x="17" y="125.00" class="scripture-num"></text><text x="31" y="125.00" class="scripture-text">your estate, and comfort your hearts;</text><text x="17" y="140.00" class="scripture-num">9</text><text x="31" y="140.00" class="scripture-text">With Onesimus, a faithful and</text><text x="17" y="153.00" class="scripture-num"></text><text x="31" y="153.00" class="scripture-text">beloved brother, who is one of you.</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">They shall make known unto you all</text><text x="17" y="179.00" class="scripture-num"></text><text x="31" y="179.00" class="scripture-text">things which are done here.</text><text x="17" y="194.00" class="scripture-num">10</text><text x="31" y="194.00" class="scripture-text">Aristarchus my fellowprisoner</text><text x="17" y="207.00" class="scripture-num"></text><text x="31" y="207.00" class="scripture-text">saluteth you, and Marcus, sister&#x27;s son</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">to Barnabas, (touching whom ye</text><text x="17" y="233.00" class="scripture-num"></text><text x="31" y="233.00" class="scripture-text">received commandments: if he come</text><text x="17" y="246.00" class="scripture-num"></text><text x="31" y="246.00" class="scripture-text">unto you, receive him;)</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">11/12</text>
  </g>
