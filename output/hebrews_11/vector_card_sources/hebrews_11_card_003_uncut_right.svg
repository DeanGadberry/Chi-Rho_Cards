    <text x="17" y="25" class="header-title">Hebrews 11:7-9</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">7</text><text x="31" y="45.00" class="scripture-text">By faith Noah, being warned of God</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">of things not seen as yet, moved with</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">fear, prepared an ark to the saving of</text><text x="17" y="84.00" class="scripture-num"></text><text x="31" y="84.00" class="scripture-text">his house; by the which he</text><text x="17" y="97.00" class="scripture-num"></text><text x="31" y="97.00" class="scripture-text">condemned the world, and became</text><text x="17" y="110.00" class="scripture-num"></text><text x="31" y="110.00" class="scripture-text">heir of the righteousness which is by</text><text x="17" y="123.00" class="scripture-num"></text><text x="31" y="123.00" class="scripture-text">faith.</text><text x="17" y="138.00" class="scripture-num">8</text><text x="31" y="138.00" class="scripture-text">By faith Abraham, when he was</text><text x="17" y="151.00" class="scripture-num"></text><text x="31" y="151.00" class="scripture-text">called to go out into a place which he</text><text x="17" y="164.00" class="scripture-num"></text><text x="31" y="164.00" class="scripture-text">should after receive for an</text><text x="17" y="177.00" class="scripture-num"></text><text x="31" y="177.00" class="scripture-text">inheritance, obeyed; and he went</text><text x="17" y="190.00" class="scripture-num"></text><text x="31" y="190.00" class="scripture-text">out, not knowing whither he went.</text><text x="17" y="205.00" class="scripture-num">9</text><text x="31" y="205.00" class="scripture-text">By faith he sojourned in the land of</text><text x="17" y="218.00" class="scripture-num"></text><text x="31" y="218.00" class="scripture-text">promise, as in a strange country,</text><text x="17" y="231.00" class="scripture-num"></text><text x="31" y="231.00" class="scripture-text">dwelling in tabernacles with Isaac</text><text x="17" y="244.00" class="scripture-num"></text><text x="31" y="244.00" class="scripture-text">and Jacob, the heirs with him of the</text><text x="17" y="257.00" class="scripture-num"></text><text x="31" y="257.00" class="scripture-text">same promise:</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">2/6</text>
