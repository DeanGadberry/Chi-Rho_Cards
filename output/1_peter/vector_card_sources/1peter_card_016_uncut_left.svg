    <g transform="translate(26.875,11.25)" clip-path="url(#trim-16)">
    <text x="17" y="25" class="header-title">1 Peter 3:8-11</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">8</text><text x="31" y="45.00" class="scripture-text">Finally, be ye all of one mind, having</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">compassion one of another, love as</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">brethren, be pitiful, be courteous:</text><text x="17" y="86.00" class="scripture-num">9</text><text x="31" y="86.00" class="scripture-text">Not rendering evil for evil, or railing</text><text x="17" y="99.00" class="scripture-num"></text><text x="31" y="99.00" class="scripture-text">for railing: but contrariwise blessing;</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">knowing that ye are thereunto</text><text x="17" y="125.00" class="scripture-num"></text><text x="31" y="125.00" class="scripture-text">called, that ye should inherit a</text><text x="17" y="138.00" class="scripture-num"></text><text x="31" y="138.00" class="scripture-text">blessing.</text><text x="17" y="153.00" class="scripture-num">10</text><text x="31" y="153.00" class="scripture-text">For he that will love life, and see</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">good days, let him refrain his tongue</text><text x="17" y="179.00" class="scripture-num"></text><text x="31" y="179.00" class="scripture-text">from evil, and his lips that they speak</text><text x="17" y="192.00" class="scripture-num"></text><text x="31" y="192.00" class="scripture-text">no guile:</text><text x="17" y="207.00" class="scripture-num">11</text><text x="31" y="207.00" class="scripture-text">Let him eschew evil, and do good; let</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">him seek peace, and ensue it.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">8/14</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">CHI-RHO</text>
