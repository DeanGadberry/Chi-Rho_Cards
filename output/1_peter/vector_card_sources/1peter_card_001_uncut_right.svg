    <text x="17" y="25" class="header-title">1 Peter 1:1-3</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">1</text><text x="31" y="45.00" class="scripture-text">Peter, an apostle of Jesus Christ, to</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">the strangers scattered throughout</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">Pontus, Galatia, Cappadocia, Asia,</text><text x="17" y="84.00" class="scripture-num"></text><text x="31" y="84.00" class="scripture-text">and Bithynia,</text><text x="17" y="99.00" class="scripture-num">2</text><text x="31" y="99.00" class="scripture-text">Elect according to the</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">foreknowledge of God the Father,</text><text x="17" y="125.00" class="scripture-num"></text><text x="31" y="125.00" class="scripture-text">through sanctification of the Spirit,</text><text x="17" y="138.00" class="scripture-num"></text><text x="31" y="138.00" class="scripture-text">unto obedience and sprinkling of the</text><text x="17" y="151.00" class="scripture-num"></text><text x="31" y="151.00" class="scripture-text">blood of Jesus Christ: Grace unto</text><text x="17" y="164.00" class="scripture-num"></text><text x="31" y="164.00" class="scripture-text">you, and peace, be multiplied.</text><text x="17" y="179.00" class="scripture-num">3</text><text x="31" y="179.00" class="scripture-text">Blessed be the God and Father of our</text><text x="17" y="192.00" class="scripture-num"></text><text x="31" y="192.00" class="scripture-text">Lord Jesus Christ, which according</text><text x="17" y="205.00" class="scripture-num"></text><text x="31" y="205.00" class="scripture-text">to his abundant mercy hath begotten</text><text x="17" y="218.00" class="scripture-num"></text><text x="31" y="218.00" class="scripture-text">us again unto a lively hope by the</text><text x="17" y="231.00" class="scripture-num"></text><text x="31" y="231.00" class="scripture-text">resurrection of Jesus Christ from the</text><text x="17" y="244.00" class="scripture-num"></text><text x="31" y="244.00" class="scripture-text">dead,</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">1/14</text>
