    <g transform="translate(26.875,11.25)" clip-path="url(#trim-6)">
    <text x="17" y="25" class="header-title">1 Peter 1:19-22</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">19</text><text x="31" y="45.00" class="scripture-text">But with the precious blood of</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">Christ, as of a lamb without blemish</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">and without spot:</text><text x="17" y="86.00" class="scripture-num">20</text><text x="31" y="86.00" class="scripture-text">Who verily was foreordained before</text><text x="17" y="99.00" class="scripture-num"></text><text x="31" y="99.00" class="scripture-text">the foundation of the world, but was</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">manifest in these last times for you,</text><text x="17" y="127.00" class="scripture-num">21</text><text x="31" y="127.00" class="scripture-text">Who by him do believe in God, that</text><text x="17" y="140.00" class="scripture-num"></text><text x="31" y="140.00" class="scripture-text">raised him up from the dead, and</text><text x="17" y="153.00" class="scripture-num"></text><text x="31" y="153.00" class="scripture-text">gave him glory; that your faith and</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">hope might be in God.</text><text x="17" y="181.00" class="scripture-num">22</text><text x="31" y="181.00" class="scripture-text">Seeing ye have purified your souls in</text><text x="17" y="194.00" class="scripture-num"></text><text x="31" y="194.00" class="scripture-text">obeying the truth through the Spirit</text><text x="17" y="207.00" class="scripture-num"></text><text x="31" y="207.00" class="scripture-text">unto unfeigned love of the brethren,</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">see that ye love one another with a</text><text x="17" y="233.00" class="scripture-num"></text><text x="31" y="233.00" class="scripture-text">pure heart fervently:</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">3/14</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">CHI-RHO</text>
  </g>
