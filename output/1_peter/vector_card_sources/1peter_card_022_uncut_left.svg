    <g transform="translate(26.875,11.25)" clip-path="url(#trim-22)">
    <text x="17" y="25" class="header-title">1 Peter 4:8-11</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">8</text><text x="31" y="45.00" class="scripture-text">And above all things have fervent</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">charity among yourselves: for charity</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">shall cover the multitude of sins.</text><text x="17" y="86.00" class="scripture-num">9</text><text x="31" y="86.00" class="scripture-text">Use hospitality one to another</text><text x="17" y="99.00" class="scripture-num"></text><text x="31" y="99.00" class="scripture-text">without grudging.</text><text x="17" y="114.00" class="scripture-num">10</text><text x="31" y="114.00" class="scripture-text">As every man hath received the gift,</text><text x="17" y="127.00" class="scripture-num"></text><text x="31" y="127.00" class="scripture-text">even so minister the same one to</text><text x="17" y="140.00" class="scripture-num"></text><text x="31" y="140.00" class="scripture-text">another, as good stewards of the</text><text x="17" y="153.00" class="scripture-num"></text><text x="31" y="153.00" class="scripture-text">manifold grace of God.</text><text x="17" y="168.00" class="scripture-num">11</text><text x="31" y="168.00" class="scripture-text">If any man speak, let him speak as</text><text x="17" y="181.00" class="scripture-num"></text><text x="31" y="181.00" class="scripture-text">the oracles of God; if any man</text><text x="17" y="194.00" class="scripture-num"></text><text x="31" y="194.00" class="scripture-text">minister, let him do it as of the</text><text x="17" y="207.00" class="scripture-num"></text><text x="31" y="207.00" class="scripture-text">ability which God giveth: that God</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">in all things may be glorified through</text><text x="17" y="233.00" class="scripture-num"></text><text x="31" y="233.00" class="scripture-text">Jesus Christ, to whom be praise and</text><text x="17" y="246.00" class="scripture-num"></text><text x="31" y="246.00" class="scripture-text">dominion for ever and ever. Amen.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">11/14</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">CHI-RHO</text>
