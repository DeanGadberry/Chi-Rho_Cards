    <g transform="translate(11.25,11.25)" clip-path="url(#trim-3)">
    <text x="17" y="25" class="header-title">Matthew 5:13-16</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">13</text><text x="31" y="45.00" class="scripture-text">Ye are the salt of the earth: but if the</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">salt have lost his savour, wherewith</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">shall it be salted? it is thenceforth</text><text x="17" y="84.00" class="scripture-num"></text><text x="31" y="84.00" class="scripture-text">good for nothing, but to be cast out,</text><text x="17" y="97.00" class="scripture-num"></text><text x="31" y="97.00" class="scripture-text">and to be trodden under foot of</text><text x="17" y="110.00" class="scripture-num"></text><text x="31" y="110.00" class="scripture-text">men.</text><text x="17" y="125.00" class="scripture-num">14</text><text x="31" y="125.00" class="scripture-text">Ye are the light of the world. A city</text><text x="17" y="138.00" class="scripture-num"></text><text x="31" y="138.00" class="scripture-text">that is set on an hill cannot be hid.</text><text x="17" y="153.00" class="scripture-num">15</text><text x="31" y="153.00" class="scripture-text">Neither do men light a candle, and</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">put it under a bushel, but on a</text><text x="17" y="179.00" class="scripture-num"></text><text x="31" y="179.00" class="scripture-text">candlestick; and it giveth light unto</text><text x="17" y="192.00" class="scripture-num"></text><text x="31" y="192.00" class="scripture-text">all that are in the house.</text><text x="17" y="207.00" class="scripture-num">16</text><text x="31" y="207.00" class="scripture-text">Let your light so shine before men,</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">that they may see your good works,</text><text x="17" y="233.00" class="scripture-num"></text><text x="31" y="233.00" class="scripture-text">and glorify your Father which is in</text><text x="17" y="246.00" class="scripture-num"></text><text x="31" y="246.00" class="scripture-text">heaven.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">2/14</text>
  </g>
