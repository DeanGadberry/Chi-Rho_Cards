    <g transform="translate(11.25,11.25)" clip-path="url(#trim-15)">
    <text x="17" y="25" class="header-title">Matthew 6:10-15</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">10</text><text x="31" y="45.00" class="scripture-text">Thy kingdom come. Thy will be</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">done in earth, as it is in heaven.</text><text x="17" y="73.00" class="scripture-num">11</text><text x="31" y="73.00" class="scripture-text">Give us this day our daily bread.</text><text x="17" y="88.00" class="scripture-num">12</text><text x="31" y="88.00" class="scripture-text">And forgive us our debts, as we</text><text x="17" y="101.00" class="scripture-num"></text><text x="31" y="101.00" class="scripture-text">forgive our debtors.</text><text x="17" y="116.00" class="scripture-num">13</text><text x="31" y="116.00" class="scripture-text">And lead us not into temptation,</text><text x="17" y="129.00" class="scripture-num"></text><text x="31" y="129.00" class="scripture-text">but deliver us from evil: For thine is</text><text x="17" y="142.00" class="scripture-num"></text><text x="31" y="142.00" class="scripture-text">the kingdom, and the power, and the</text><text x="17" y="155.00" class="scripture-num"></text><text x="31" y="155.00" class="scripture-text">glory, for ever. Amen.</text><text x="17" y="170.00" class="scripture-num">14</text><text x="31" y="170.00" class="scripture-text">For if ye forgive men their trespasses,</text><text x="17" y="183.00" class="scripture-num"></text><text x="31" y="183.00" class="scripture-text">your heavenly Father will also</text><text x="17" y="196.00" class="scripture-num"></text><text x="31" y="196.00" class="scripture-text">forgive you:</text><text x="17" y="211.00" class="scripture-num">15</text><text x="31" y="211.00" class="scripture-text">But if ye forgive not men their</text><text x="17" y="224.00" class="scripture-num"></text><text x="31" y="224.00" class="scripture-text">trespasses, neither will your Father</text><text x="17" y="237.00" class="scripture-num"></text><text x="31" y="237.00" class="scripture-text">forgive your trespasses.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">8/14</text>
  </g>
