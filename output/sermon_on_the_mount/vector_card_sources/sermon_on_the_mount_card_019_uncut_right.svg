    <g transform="translate(11.25,11.25)" clip-path="url(#trim-19)">
    <text x="17" y="25" class="header-title">Matthew 6:27-30</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">27</text><text x="31" y="45.00" class="scripture-text">Which of you by taking thought can</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">add one cubit unto his stature?</text><text x="17" y="73.00" class="scripture-num">28</text><text x="31" y="73.00" class="scripture-text">And why take ye thought for</text><text x="17" y="86.00" class="scripture-num"></text><text x="31" y="86.00" class="scripture-text">raiment? Consider the lilies of the</text><text x="17" y="99.00" class="scripture-num"></text><text x="31" y="99.00" class="scripture-text">field, how they grow; they toil not,</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">neither do they spin:</text><text x="17" y="127.00" class="scripture-num">29</text><text x="31" y="127.00" class="scripture-text">And yet I say unto you, That even</text><text x="17" y="140.00" class="scripture-num"></text><text x="31" y="140.00" class="scripture-text">Solomon in all his glory was not</text><text x="17" y="153.00" class="scripture-num"></text><text x="31" y="153.00" class="scripture-text">arrayed like one of these.</text><text x="17" y="168.00" class="scripture-num">30</text><text x="31" y="168.00" class="scripture-text">Wherefore, if God so clothe the grass</text><text x="17" y="181.00" class="scripture-num"></text><text x="31" y="181.00" class="scripture-text">of the field, which to day is, and to</text><text x="17" y="194.00" class="scripture-num"></text><text x="31" y="194.00" class="scripture-text">morrow is cast into the oven, shall he</text><text x="17" y="207.00" class="scripture-num"></text><text x="31" y="207.00" class="scripture-text">not much more clothe you, O ye of</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">little faith?</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">10/14</text>
  </g>
