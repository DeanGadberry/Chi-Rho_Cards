    <g transform="translate(11.25,11.25)" clip-path="url(#trim-1)">
    <text x="17" y="25" class="header-title">Matthew 5:1-7</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">1</text><text x="31" y="45.00" class="scripture-text">And seeing the multitudes, he went</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">up into a mountain: and when he</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">was set, his disciples came unto him:</text><text x="17" y="86.00" class="scripture-num">2</text><text x="31" y="86.00" class="scripture-text">And he opened his mouth, and</text><text x="17" y="99.00" class="scripture-num"></text><text x="31" y="99.00" class="scripture-text">taught them, saying,</text><text x="17" y="114.00" class="scripture-num">3</text><text x="31" y="114.00" class="scripture-text">Blessed are the poor in spirit: for</text><text x="17" y="127.00" class="scripture-num"></text><text x="31" y="127.00" class="scripture-text">theirs is the kingdom of heaven.</text><text x="17" y="142.00" class="scripture-num">4</text><text x="31" y="142.00" class="scripture-text">Blessed are they that mourn: for they</text><text x="17" y="155.00" class="scripture-num"></text><text x="31" y="155.00" class="scripture-text">shall be comforted.</text><text x="17" y="170.00" class="scripture-num">5</text><text x="31" y="170.00" class="scripture-text">Blessed are the meek: for they shall</text><text x="17" y="183.00" class="scripture-num"></text><text x="31" y="183.00" class="scripture-text">inherit the earth.</text><text x="17" y="198.00" class="scripture-num">6</text><text x="31" y="198.00" class="scripture-text">Blessed are they which do hunger</text><text x="17" y="211.00" class="scripture-num"></text><text x="31" y="211.00" class="scripture-text">and thirst after righteousness: for</text><text x="17" y="224.00" class="scripture-num"></text><text x="31" y="224.00" class="scripture-text">they shall be filled.</text><text x="17" y="239.00" class="scripture-num">7</text><text x="31" y="239.00" class="scripture-text">Blessed are the merciful: for they</text><text x="17" y="252.00" class="scripture-num"></text><text x="31" y="252.00" class="scripture-text">shall obtain mercy.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">1/14</text>
  </g>
</svg>