    <g transform="translate(26.875,11.25)" clip-path="url(#trim-10)">
    <text x="17" y="25" class="header-title">James 2:14-18</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">14</text><text x="31" y="45.00" class="scripture-text">What doth it profit, my brethren,</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">though a man say he hath faith, and</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">have not works? can faith save him?</text><text x="17" y="86.00" class="scripture-num">15</text><text x="31" y="86.00" class="scripture-text">If a brother or sister be naked, and</text><text x="17" y="99.00" class="scripture-num"></text><text x="31" y="99.00" class="scripture-text">destitute of daily food,</text><text x="17" y="114.00" class="scripture-num">16</text><text x="31" y="114.00" class="scripture-text">And one of you say unto them,</text><text x="17" y="127.00" class="scripture-num"></text><text x="31" y="127.00" class="scripture-text">Depart in peace, be ye warmed and</text><text x="17" y="140.00" class="scripture-num"></text><text x="31" y="140.00" class="scripture-text">filled; notwithstanding ye give them</text><text x="17" y="153.00" class="scripture-num"></text><text x="31" y="153.00" class="scripture-text">not those things which are needful</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">to the body; what doth it profit?</text><text x="17" y="181.00" class="scripture-num">17</text><text x="31" y="181.00" class="scripture-text">Even so faith, if it hath not works, is</text><text x="17" y="194.00" class="scripture-num"></text><text x="31" y="194.00" class="scripture-text">dead, being alone.</text><text x="17" y="209.00" class="scripture-num">18</text><text x="31" y="209.00" class="scripture-text">Yea, a man may say, Thou hast faith,</text><text x="17" y="222.00" class="scripture-num"></text><text x="31" y="222.00" class="scripture-text">and I have works: shew me thy faith</text><text x="17" y="235.00" class="scripture-num"></text><text x="31" y="235.00" class="scripture-text">without thy works, and I will shew</text><text x="17" y="248.00" class="scripture-num"></text><text x="31" y="248.00" class="scripture-text">thee my faith by my works.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">5/13</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">CHI-RHO</text>
  </g>
