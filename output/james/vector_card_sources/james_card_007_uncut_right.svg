    <text x="17" y="25" class="header-title">James 2:1-4</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">1</text><text x="31" y="45.00" class="scripture-text">My brethren, have not the faith of</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">our Lord Jesus Christ, the Lord of</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">glory, with respect of persons.</text><text x="17" y="86.00" class="scripture-num">2</text><text x="31" y="86.00" class="scripture-text">For if there come unto your</text><text x="17" y="99.00" class="scripture-num"></text><text x="31" y="99.00" class="scripture-text">assembly a man with a gold ring, in</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">goodly apparel, and there come in</text><text x="17" y="125.00" class="scripture-num"></text><text x="31" y="125.00" class="scripture-text">also a poor man in vile raiment;</text><text x="17" y="140.00" class="scripture-num">3</text><text x="31" y="140.00" class="scripture-text">And ye have respect to him that</text><text x="17" y="153.00" class="scripture-num"></text><text x="31" y="153.00" class="scripture-text">weareth the gay clothing, and say</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">unto him, Sit thou here in a good</text><text x="17" y="179.00" class="scripture-num"></text><text x="31" y="179.00" class="scripture-text">place; and say to the poor, Stand</text><text x="17" y="192.00" class="scripture-num"></text><text x="31" y="192.00" class="scripture-text">thou there, or sit here under my</text><text x="17" y="205.00" class="scripture-num"></text><text x="31" y="205.00" class="scripture-text">footstool:</text><text x="17" y="220.00" class="scripture-num">4</text><text x="31" y="220.00" class="scripture-text">Are ye not then partial in yourselves,</text><text x="17" y="233.00" class="scripture-num"></text><text x="31" y="233.00" class="scripture-text">and are become judges of evil</text><text x="17" y="246.00" class="scripture-num"></text><text x="31" y="246.00" class="scripture-text">thoughts?</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">4/13</text>
