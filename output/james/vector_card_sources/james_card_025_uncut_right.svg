    <g transform="translate(11.25,11.25)" clip-path="url(#trim-25)">
    <text x="17" y="25" class="header-title">James 5:17-20</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">17</text><text x="31" y="45.00" class="scripture-text">Elias was a man subject to like</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">passions as we are, and he prayed</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">earnestly that it might not rain: and</text><text x="17" y="84.00" class="scripture-num"></text><text x="31" y="84.00" class="scripture-text">it rained not on the earth by the</text><text x="17" y="97.00" class="scripture-num"></text><text x="31" y="97.00" class="scripture-text">space of three years and six months.</text><text x="17" y="112.00" class="scripture-num">18</text><text x="31" y="112.00" class="scripture-text">And he prayed again, and the heaven</text><text x="17" y="125.00" class="scripture-num"></text><text x="31" y="125.00" class="scripture-text">gave rain, and the earth brought</text><text x="17" y="138.00" class="scripture-num"></text><text x="31" y="138.00" class="scripture-text">forth her fruit.</text><text x="17" y="153.00" class="scripture-num">19</text><text x="31" y="153.00" class="scripture-text">Brethren, if any of you do err from</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">the truth, and one convert him;</text><text x="17" y="181.00" class="scripture-num">20</text><text x="31" y="181.00" class="scripture-text">Let him know, that he which</text><text x="17" y="194.00" class="scripture-num"></text><text x="31" y="194.00" class="scripture-text">converteth the sinner from the error</text><text x="17" y="207.00" class="scripture-num"></text><text x="31" y="207.00" class="scripture-text">of his way shall save a soul from</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">death, and shall hide a multitude of</text><text x="17" y="233.00" class="scripture-num"></text><text x="31" y="233.00" class="scripture-text">sins.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">13/13</text>
  </g>
</svg>