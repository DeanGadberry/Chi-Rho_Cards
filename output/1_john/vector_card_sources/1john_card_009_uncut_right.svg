    <g transform="translate(11.25,11.25)" clip-path="url(#trim-9)">
    <text x="17" y="25" class="header-title">1 John 2:21-24</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">21</text><text x="31" y="45.00" class="scripture-text">I have not written unto you because</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">ye know not the truth, but because</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">ye know it, and that no lie is of the</text><text x="17" y="84.00" class="scripture-num"></text><text x="31" y="84.00" class="scripture-text">truth.</text><text x="17" y="99.00" class="scripture-num">22</text><text x="31" y="99.00" class="scripture-text">Who is a liar but he that denieth that</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">Jesus is the Christ? He is antichrist,</text><text x="17" y="125.00" class="scripture-num"></text><text x="31" y="125.00" class="scripture-text">that denieth the Father and the Son.</text><text x="17" y="140.00" class="scripture-num">23</text><text x="31" y="140.00" class="scripture-text">Whosoever denieth the Son, the</text><text x="17" y="153.00" class="scripture-num"></text><text x="31" y="153.00" class="scripture-text">same hath not the Father: (but) he</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">that acknowledgeth the Son hath the</text><text x="17" y="179.00" class="scripture-num"></text><text x="31" y="179.00" class="scripture-text">Father also.</text><text x="17" y="194.00" class="scripture-num">24</text><text x="31" y="194.00" class="scripture-text">Let that therefore abide in you,</text><text x="17" y="207.00" class="scripture-num"></text><text x="31" y="207.00" class="scripture-text">which ye have heard from the</text><text x="17" y="220.00" class="scripture-num"></text><text x="31" y="220.00" class="scripture-text">beginning. If that which ye have</text><text x="17" y="233.00" class="scripture-num"></text><text x="31" y="233.00" class="scripture-text">heard from the beginning shall</text><text x="17" y="246.00" class="scripture-num"></text><text x="31" y="246.00" class="scripture-text">remain in you, ye also shall continue</text><text x="17" y="259.00" class="scripture-num"></text><text x="31" y="259.00" class="scripture-text">in the Son, and in the Father.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">5/13</text>
