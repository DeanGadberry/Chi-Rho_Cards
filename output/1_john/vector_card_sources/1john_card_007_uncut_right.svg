    <g transform="translate(11.25,11.25)" clip-path="url(#trim-7)">
    <text x="17" y="25" class="header-title">1 John 2:14-16</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">14</text><text x="31" y="45.00" class="scripture-text">I have written unto you, fathers,</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">because ye have known him that is</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">from the beginning. I have written</text><text x="17" y="84.00" class="scripture-num"></text><text x="31" y="84.00" class="scripture-text">unto you, young men, because ye are</text><text x="17" y="97.00" class="scripture-num"></text><text x="31" y="97.00" class="scripture-text">strong, and the word of God abideth</text><text x="17" y="110.00" class="scripture-num"></text><text x="31" y="110.00" class="scripture-text">in you, and ye have overcome the</text><text x="17" y="123.00" class="scripture-num"></text><text x="31" y="123.00" class="scripture-text">wicked one.</text><text x="17" y="138.00" class="scripture-num">15</text><text x="31" y="138.00" class="scripture-text">Love not the world, neither the</text><text x="17" y="151.00" class="scripture-num"></text><text x="31" y="151.00" class="scripture-text">things that are in the world. If any</text><text x="17" y="164.00" class="scripture-num"></text><text x="31" y="164.00" class="scripture-text">man love the world, the love of the</text><text x="17" y="177.00" class="scripture-num"></text><text x="31" y="177.00" class="scripture-text">Father is not in him.</text><text x="17" y="192.00" class="scripture-num">16</text><text x="31" y="192.00" class="scripture-text">For all that is in the world, the lust of</text><text x="17" y="205.00" class="scripture-num"></text><text x="31" y="205.00" class="scripture-text">the flesh, and the lust of the eyes,</text><text x="17" y="218.00" class="scripture-num"></text><text x="31" y="218.00" class="scripture-text">and the pride of life, is not of the</text><text x="17" y="231.00" class="scripture-num"></text><text x="31" y="231.00" class="scripture-text">Father, but is of the world.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">4/13</text>
  </g>
