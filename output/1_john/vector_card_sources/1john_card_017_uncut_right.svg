    <g transform="translate(11.25,11.25)" clip-path="url(#trim-17)">
    <text x="17" y="25" class="header-title">1 John 4:1-3</text><line x1="17" y1="30" x2="190" y2="30" class="header-rule" />
    <text x="17" y="45.00" class="scripture-num">1</text><text x="31" y="45.00" class="scripture-text">Beloved, believe not every spirit, but</text><text x="17" y="58.00" class="scripture-num"></text><text x="31" y="58.00" class="scripture-text">try the spirits whether they are of</text><text x="17" y="71.00" class="scripture-num"></text><text x="31" y="71.00" class="scripture-text">God: because many false prophets</text><text x="17" y="84.00" class="scripture-num"></text><text x="31" y="84.00" class="scripture-text">are gone out into the world.</text><text x="17" y="99.00" class="scripture-num">2</text><text x="31" y="99.00" class="scripture-text">Hereby know ye the Spirit of God:</text><text x="17" y="112.00" class="scripture-num"></text><text x="31" y="112.00" class="scripture-text">Every spirit that confesseth that</text><text x="17" y="125.00" class="scripture-num"></text><text x="31" y="125.00" class="scripture-text">Jesus Christ is come in the flesh is of</text><text x="17" y="138.00" class="scripture-num"></text><text x="31" y="138.00" class="scripture-text">God:</text><text x="17" y="153.00" class="scripture-num">3</text><text x="31" y="153.00" class="scripture-text">And every spirit that confesseth not</text><text x="17" y="166.00" class="scripture-num"></text><text x="31" y="166.00" class="scripture-text">that Jesus Christ is come in the flesh</text><text x="17" y="179.00" class="scripture-num"></text><text x="31" y="179.00" class="scripture-text">is not of God: and this is that spirit</text><text x="17" y="192.00" class="scripture-num"></text><text x="31" y="192.00" class="scripture-text">of antichrist, whereof ye have heard</text><text x="17" y="205.00" class="scripture-num"></text><text x="31" y="205.00" class="scripture-text">that it should come; and even now</text><text x="17" y="218.00" class="scripture-num"></text><text x="31" y="218.00" class="scripture-text">already is it in the world.</text>
    <line x1="17" y1="290" x2="190" y2="290" class="footer-rule" /><text x="17" y="300" class="footer-text">CHI-RHO</text><text x="103.5" y="300" text-anchor="middle" class="footer-text">KJV</text><text x="190" y="300" text-anchor="end" class="footer-text">9/13</text>
  </g>
